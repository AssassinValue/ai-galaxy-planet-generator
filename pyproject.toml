[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-galaxy-planet-generator"
version = "0.9.4"
description = "AI-driven procedural planet and galaxy generator for Windows desktop (PySide6 + PyTorch)."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Potato Labs", email = "chef@potatolabs.dev" }]
keywords = ["procedural", "galaxy", "planet", "generative", "noise", "diffusion", "pytorch", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "PySide6>=6.7,<6.9",
  "numpy>=1.26,<2.2",
  "scipy>=1.13,<1.15",
  "noise>=1.2.2",
  "torch>=2.4,<2.7",
  "pydantic>=2.7,<2.11",
  "pillow>=10.3,<11.2",
  "rich>=13.7,<14.1",
  "pyyaml>=6.0.1,<6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-qt>=4.4", "ruff>=0.6", "mypy>=1.11", "pyinstaller>=6.9"]
cuda = ["torch>=2.4,<2.7"]

[project.scripts]
galaxy-gen = "galaxyforge.bootstrap.app:main"
gf-cli = "galaxyforge.bootstrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["galaxyforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q --maxfail=1"